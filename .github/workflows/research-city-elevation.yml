name: Research official city elevation metadata
on:
  workflow_dispatch:
  push:
    branches: [research/ctr-vertical-reference-20261031]
    paths: [.github/workflows/research-city-elevation.yml, scripts/fetch-city-dtm.mjs]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated GeoTIFF parser
        run: npm install --prefix work/ctr-deps --ignore-scripts --no-audit --no-fund geotiff@2.1.3
      - name: Acquire bounded official raw float32 DTM crop
        run: node scripts/fetch-city-dtm.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctr-dtm-raw-crop
          path: data/napoli-dtm-2020/
          retention-days: 7
