name: Research official city elevation metadata
on:
  workflow_dispatch:
  push:
    branches: [research/ctr-vertical-reference-20261031]
    paths: [.github/workflows/research-city-elevation.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded public official metadata requests
        run: |
          mkdir -p work/ctr-vertical
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          let count=0;
          const seen=new Set(),records=[];
          function links(value,out=[]){if(typeof value==='string'&&/^https?:\/\//.test(value)&&/geomaps\.regione\.campania\.it|regionecampania\.sharepoint\.com/.test(value))out.push(value);else if(Array.isArray(value))for(const x of value)links(x,out);else if(value&&typeof value==='object')for(const x of Object.values(value))links(x,out);return [...new Set(out)];}
          async function request(url){
            if(seen.has(url)||count>=12)return null;seen.add(url);count++;
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(20000)});if(!response.ok)throw Error('HTTP '+response.status);
              const parts=[];let bytes=0;for await(const part of response.body){bytes+=part.length;if(bytes>1024*1024)throw Error('Metadata exceeds1MiB');parts.push(part);}
              const data=JSON.parse(Buffer.concat(parts).toString('utf8'));await writeFile('work/ctr-vertical/metadata-'+count+'.json',JSON.stringify({url,data},null,2));
              const record={url,title:data.name??data.title,description:data.description??data.serviceDescription,spatialReference:data.spatialReference??data.sourceSpatialReference,units:data.units,vertical:data.vcsWkid??data.verticalCoordinateSystem,fields:data.fields?.map(x=>({name:x.name,alias:x.alias,type:x.type})),layers:data.layers?.map(x=>({id:x.id,name:x.name})),services:data.services,items:data.results?.map(x=>({id:x.id,title:x.title,type:x.type,url:x.url})),dataSources:data.dataSources,links:links(data),error:data.error};records.push(record);console.log('CTR_PUBLIC_METADATA='+JSON.stringify(record));return data;
            }catch(error){const record={url,error:error.message};records.push(record);console.log('CTR_PUBLIC_METADATA='+JSON.stringify(record));return null;}
          }
          const base='https://geomaps.regione.campania.it';
          const directory=await request(base+'/federated/rest/services/DG5009?f=pjson');
          const app=await request(base+'/portal/sharing/rest/content/items/389a5209e4ac4aad813e11ea5f6007f9/data?f=json');
          const search=await request(base+'/portal/sharing/rest/search?f=json&num=50&q='+encodeURIComponent('DTM 2020'));
          for(const service of directory?.services??[])if(/DTM|DEM|altim|quota/i.test(service.name))await request(base+'/federated/rest/services/'+service.name+'/'+service.type+'?f=pjson');
          for(const url of links(app??{}).filter(x=>/\/rest\/services\//.test(x)).slice(0,4))await request(url+(url.includes('?')?'&':'?')+'f=pjson');
          for(const item of search?.results??[])if(/DTM|terreno|altim/i.test(item.title??'')){if(item.url)await request(item.url+(item.url.includes('?')?'&':'?')+'f=pjson');else await request(base+'/portal/sharing/rest/content/items/'+item.id+'?f=json');}
          await writeFile('work/ctr-vertical/summary.json',JSON.stringify(records,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctr-vertical-metadata
          path: work/ctr-vertical/
          retention-days: 7
