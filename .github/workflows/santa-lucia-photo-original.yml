name: Acquire approved Santa Lucia original and full FAL license
on:
  workflow_dispatch:
  push:
    branches: [research/santa-lucia-original-20261101]
    paths:
      - .github/workflows/santa-lucia-photo-original.yml
      - scripts/acquire-santa-lucia-pitrou.mjs
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify one approved JPEG and preserve the official complete license
        run: node scripts/acquire-santa-lucia-pitrou.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: santa-lucia-pitrou-original-${{ github.run_id }}
          path: work/santa-lucia-pitrou-2011/
          retention-days: 30
          if-no-files-found: warn
