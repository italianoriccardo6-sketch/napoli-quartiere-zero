name: Render reale Babylon con WebGL software
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/render-qa.yml
permissions:
  contents: write
concurrency:
  group: napoli-engine-render-qa
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Librerie grafiche Linux per il contesto WebGL software
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libgl1-mesa-dev libxi-dev libxext-dev pkg-config
      - run: npm ci --no-audit --no-fund
      - name: Binding WebGL nativo soltanto nel runner di verifica
        env:
          npm_config_devdir: ${{ runner.temp }}/napoli-node-gyp
        run: npm install --no-save --package-lock=false --no-audit --no-fund gl@8.1.6
      - name: Prepara runtime Node e WebGL portabile per iterazioni locali
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),{createRequire}=require('node:module');
          const root=path.resolve('work/qa-runtime');
          const copy=(from,to)=>{fs.mkdirSync(path.dirname(to),{recursive:true});fs.cpSync(from,to,{recursive:true});};
          copy(process.execPath,path.join(root,'bin/node'));
          for(const bin of ['Xvfb','xvfb-run','xauth','xkbcomp'])copy('/usr/bin/'+bin,path.join(root,'bin',bin));
          const glRoot=path.dirname(require.resolve('gl/package.json'));
          for(const file of ['index.js','package.json','src/javascript'])copy(path.join(glRoot,file),path.join(root,'node_modules/gl',file));
          const release=path.join(glRoot,'build/Release');
          for(const file of fs.readdirSync(release))if(/\.node$|\.so(?:\.|$)/.test(file))copy(path.join(release,file),path.join(root,'node_modules/gl/build/Release',file));
          const seen=new Set();
          function dependency(name,loader=require){
            const manifest=loader.resolve(name+'/package.json');if(seen.has(manifest))return;seen.add(manifest);
            const meta=JSON.parse(fs.readFileSync(manifest,'utf8'));copy(path.dirname(manifest),path.join(root,'node_modules',meta.name));
            const nested=createRequire(manifest);for(const child of Object.keys(meta.dependencies??{}))dependency(child,nested);
          }
          for(const name of ['bindings','bit-twiddle','glsl-tokenizer'])dependency(name);
          fs.writeFileSync(path.join(root,'runtime.json'),JSON.stringify({node:process.version,abi:process.versions.modules,platform:process.platform,arch:process.arch,gl:require('gl/package.json').version,note:'QA-only native runtime; uses host Linux X11/Mesa shared libraries. Never a browser/macOS benchmark.'},null,2));
          fs.writeFileSync(path.join(root,'RUN.txt'),'From the repository root: PATH="$PWD/work/qa-runtime/bin:$PATH" NODE_PATH="$PWD/work/qa-runtime/node_modules" LIBGL_ALWAYS_SOFTWARE=1 work/qa-runtime/bin/xvfb-run -a work/qa-runtime/bin/node --import tsx scripts/render-qa.ts --trace-gl --pbr --car --detail --view=drive\n');
          NODE
          ldd work/qa-runtime/bin/Xvfb > work/qa-runtime/xvfb-shared-libraries.txt
          ldd work/qa-runtime/node_modules/gl/build/Release/webgl.node > work/qa-runtime/gl-shared-libraries.txt
          tar -czf work/qa-runtime.tar.gz -C work qa-runtime
          test "$(stat -c%s work/qa-runtime.tar.gz)" -lt 104857600
      - uses: actions/upload-artifact@v4
        with:
          name: napoli-qa-native-runtime-${{ github.run_id }}
          path: work/qa-runtime.tar.gz
          compression-level: 0
          retention-days: 7
      - name: Render della scena giocabile con materiali PBR, auto e dettagli reali del sorgente
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p work
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' node --import tsx scripts/render-qa.ts --trace-gl --pbr --car --detail --width=1024 --height=576 --output=work/render-current.png 2>&1 | tee work/render-log.txt
          xvfb-run -a -s '-screen 0 1280x720x24' node --import tsx scripts/render-qa.ts --trace-gl --pbr --car --detail --view=drive --width=1024 --height=576 --output=work/render-driving.png 2>&1 | tee work/render-driving-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: napoli-engine-render-${{ github.run_id }}
          path: |
            work/render-*.png
            work/render-*.json
            work/render-*log.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Conserva fotogrammi e diagnostica nel ramo QA, marcando gli eventuali candidati falliti
        if: always()
        env:
          QA_BRANCH: qa/render-${{ github.run_id }}
        run: |
          if ! compgen -G 'work/render-*.png' > /dev/null; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$QA_BRANCH"
          mkdir -p qa/render
          cp work/render-*.png work/render-*.json qa/render/
          git add qa/render/
          git commit -m 'Record actual Babylon source-scene software WebGL candidates and validation diagnostics'
          git push origin "HEAD:refs/heads/$QA_BRANCH"
