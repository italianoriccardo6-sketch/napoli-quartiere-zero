name: Verifica comparse opzionali su geografia OSM
on:
  push:
    branches: [feature/ambient-city-20261031]
    paths:
      - src/ambient-city.ts
      - tests/ambient-city.test.ts
      - .github/workflows/ambient-city-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx tests/ambient-city.test.ts
