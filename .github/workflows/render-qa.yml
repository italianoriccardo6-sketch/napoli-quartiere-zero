name: Render reale Babylon con WebGL software
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/render-qa.yml
permissions:
  contents: write
concurrency:
  group: napoli-engine-render-qa
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Librerie grafiche Linux per il contesto WebGL software
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libgl1-mesa-dev libxi-dev libxext-dev pkg-config
      - run: npm ci --no-audit --no-fund
      - name: Binding WebGL nativo soltanto nel runner di verifica
        env:
          npm_config_devdir: ${{ runner.temp }}/napoli-node-gyp
        run: npm install --no-save --package-lock=false --no-audit --no-fund gl@8.1.6
      - name: Render della scena giocabile con materiali PBR, auto e dettagli reali del sorgente
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p work
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' node --import tsx scripts/render-qa.ts --pbr --car --detail --width=1024 --height=576 --output=work/render-current.png 2>&1 | tee work/render-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: napoli-engine-render-${{ github.run_id }}
          path: |
            work/render-current.png
            work/render-current.json
            work/render-current.error.json
            work/render-log.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Conserva il fotogramma effettivo in un ramo QA ispezionabile
        if: success()
        env:
          QA_BRANCH: qa/render-${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$QA_BRANCH"
          mkdir -p qa/render
          cp work/render-current.png work/render-current.json qa/render/
          git add qa/render/render-current.png qa/render/render-current.json
          git commit -m 'Record actual Babylon source-scene software WebGL frame and diagnostics'
          git push origin "HEAD:refs/heads/$QA_BRANCH"
