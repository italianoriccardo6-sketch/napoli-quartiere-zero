name: Ricerca metadati modelli Napoli
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/research-naples-models.mjs
      - .github/workflows/research-naples-models.yml
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Leggi soltanto i metadati pubblici dei due candidati
        run: node scripts/research-naples-models.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naples-model-metadata-${{ github.sha }}
          path: work/naples-model-research/
          retention-days: 14
