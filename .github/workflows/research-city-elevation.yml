name: Probe official Napoli DBT source access
on:
  workflow_dispatch:
  push:
    branches: [research/ctr-vertical-reference-20261031]
    paths: [.github/workflows/research-city-elevation.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded normal GET for the advertised public DBT download
        run: |
          mkdir -p work/ctr-building
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const url='https://regionecampania.sharepoint.com/:u:/s/50-09-92-CTR2020/EamLA3QPET5Ou7M3hhPLbEABybtBctLnehddJ_tSGW4iaw?download=1';
          const response=await fetch(url,{headers:{Range:'bytes=0-1023'},signal:AbortSignal.timeout(25000)});
          const reader=response.body.getReader(),first=await reader.read();await reader.cancel();
          const result={sourceUrl:url,status:response.status,finalUrl:response.url,headers:Object.fromEntries([...response.headers].filter(([k])=>/content-type|content-length|content-disposition|content-range|location|www-authenticate/i.test(k))),firstBytesHex:Buffer.from(first.value??[]).subarray(0,32).toString('hex')};
          await writeFile('work/ctr-building/download-probe.json',JSON.stringify(result,null,2));console.log('NAPOLI_DBT_ACCESS='+JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: napoli-dbt-access-probe
          path: work/ctr-building/
          retention-days: 7
